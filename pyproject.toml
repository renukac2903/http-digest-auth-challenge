[project]
name = "http-digest-auth-challenge"
version = "0.1.1"
description = "Digest authentication library that parses WWW-Authenticate challenges and generates Authorization responses per RFC 7616"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
